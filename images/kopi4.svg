  <rect x="205" y="130" width="22" height="22" rx="4" fill="#ffffff" opacity="0.5" transform="rotate(-20 216 141)"/>
  <rect x="180" y="165" width="22" height="22" rx="4" fill="#ffffff" opacity="0.45"/>
