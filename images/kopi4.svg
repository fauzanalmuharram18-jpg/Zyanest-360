  <line x1="200" y1="45" x2="175" y2="135" stroke="#424242" stroke-width="7" stroke-linecap="round"/>
  <path d="M150,90 L165,225 Q165,232 200,232 Q235,232 235,225 L250,90 Z" fill="#3e2723" opacity="0.85" stroke="#bcaaa4" stroke-width="3"/>
