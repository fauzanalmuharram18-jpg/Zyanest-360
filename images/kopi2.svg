<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f5ede6"/>
  <!-- Gelas Ice Coffee Susu Gula Aren -->
  <!-- Sedotan -->
  <line x1="200" y1="40" x2="165" y2="150" stroke="#795548" stroke-width="8" stroke-linecap="round"/>
  <!-- Gelas plastik cup -->
  <path d="M150,90 L165,220 Q165,230 200,230 Q235,230 235,220 L250,90 Z" fill="#ffffff" stroke="#bcaaa4" stroke-width="3" opacity="0.9"/>
  <!-- Layer gula aren bawah -->
  <path d="M166,190 L165,220 Q165,230 200,230 Q235,230 235,220 L234,190 Z" fill="#4e342e"/>
  <!-- Layer susu tengah -->
  <path d="M162,145 L166,190 L234,190 L238,145 Z" fill="#fff8e1"/>
  <!-- Layer kopi atas -->
  <path d="M154,100 L162,145 L238,145 L246,100 Z" fill="#6d4c41"/>
  <!-- Es batu -->
  <rect x="180" y="110" width="22" height="22" rx="4" fill="#ffffff" opacity="0.6"/>
  <rect x="205" y="125" width="20" height="20" rx="4" fill="#ffffff" opacity="0.6"/>
  <!-- Tutup cup -->
  <ellipse cx="200" cy="90" rx="52" ry="12" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5d4037" text-anchor="middle">Kopi Susu Gula Aren</text>
</svg>
