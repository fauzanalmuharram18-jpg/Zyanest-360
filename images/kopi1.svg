  <ellipse cx="200" cy="225" rx="90" ry="15" fill="#d7ccc8"/>
  <path d="M140,130 C140,210 160,220 200,220 C240,220 260,210 260,130 Z" fill="#ffffff" stroke="#8d6e63" stroke-width="4"/>
  <!-- Kuping cangkir -->
  <path d="M255,145 C285,145 285,190 250,195" fill="none" stroke="#8d6e63" stroke-width="6" stroke-linecap="round"/>
