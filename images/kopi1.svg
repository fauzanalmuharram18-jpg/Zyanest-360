  <!-- Asap uap -->
  <path d="M190,110 Q180,90 190,75 Q200,60 190,45" fill="none" stroke="#bcaaa4" stroke-width="3" stroke-linecap="round"/>
  <path d="M210,115 Q220,95 210,80 Q200,65 210,50" fill="none" stroke="#bcaaa4" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5d4037" text-anchor="middle">Espresso Double Shot</text>
</svg>
